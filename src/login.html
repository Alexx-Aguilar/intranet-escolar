<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Intranet Escolar</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">

    <main class="login-container">

        <section class="login-card">

            <div class="login-logo">
                🏫
            </div>

            <p class="login-etiqueta">
                PORTAL ESTUDIANTIL
            </p>

            <h1>
                Bienvenido
            </h1>

            <p class="login-descripcion">
                Ingresa tus datos para acceder a la intranet escolar.
            </p>


            <form id="loginForm">

                <div class="campo">
                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Ingresa tu usuario"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >
                </div>


                <div class="opciones-login">

                    <label>
                        <input type="checkbox">
                        Recordarme
                    </label>

                    <a href="#">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>


                <button type="submit" class="login-btn">
                    Iniciar sesión
                </button>

            </form>


            <p id="mensajeLogin" class="mensaje-login"></p>

            <div class="login-footer">
                <span>© 2026 Intranet Escolar</span>
            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
