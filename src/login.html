<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Intranet Escolar</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">

    <div class="login-orbe login-orbe-uno" aria-hidden="true"></div>
    <div class="login-orbe login-orbe-dos" aria-hidden="true"></div>

    <main class="login-container">

        <section class="login-card">

            <div class="login-logo" aria-label="Intranet Escolar">
                <span class="login-logo-iniciales">IE</span>
                <span class="login-logo-destello" aria-hidden="true">✦</span>
            </div>

            <p class="login-etiqueta">
                PORTAL ESTUDIANTIL
            </p>

            <h1>
                Bienvenido
            </h1>

            <p class="login-descripcion">
                Ingresa tus datos para continuar con tu espacio académico.
            </p>


            <form id="loginForm">

                <div class="campo">
                    <label for="usuario">
                        Usuario
                    </label>

                    <div class="input-con-icono">
                        <span class="input-icono" aria-hidden="true">👤</span>
                        <input
                            type="text"
                            id="usuario"
                            placeholder="Ingresa tu usuario"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>


                <div class="campo">
                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-con-icono">
                        <span class="input-icono" aria-hidden="true">🔒</span>
                        <input
                            type="password"
                            id="password"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                </div>


                <div class="opciones-login">

                    <label>
                        <input type="checkbox">
                        Recordarme
                    </label>

                    <a href="#">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>


                <button type="submit" class="login-btn">
                    <span>Iniciar sesión</span>
                    <span aria-hidden="true">→</span>
                </button>

            </form>


            <p id="mensajeLogin" class="mensaje-login"></p>

            <div class="login-footer">
                <span>© 2026 Intranet Escolar</span>
            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
